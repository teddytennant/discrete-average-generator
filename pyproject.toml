[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-average-generator"
version = "0.1.0"
description = "Discrete average-generator matching for finite-state CTMCs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "equinox",
    "optax",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
